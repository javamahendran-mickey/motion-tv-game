<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Motion Game Controller</title>
  <link rel="stylesheet" href="phone.css">
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
</head>
<body>
  <div id="controller-app">
    <!-- Top Status Bar: Clean, minimal -->
    <header class="controller-bar">
      <div class="status-indicator">
        <span class="status-bulb disconnected" id="bulb"></span>
        <span id="status-label">CONNECTING...</span>
      </div>
      <div class="latency-badge" id="ping-badge">-- ms</div>
    </header>

    <!-- 3 Simple Mode Tabs -->
    <nav class="mode-tabs">
      <button class="tab-btn active" id="tab-handheld">
        <span class="tab-icon">🎮</span>
        <span class="tab-text">Gamepad</span>
      </button>
      <button class="tab-btn" id="tab-body">
        <span class="tab-icon">🧍</span>
        <span class="tab-text">Body Camera</span>
      </button>
      <a class="tab-btn" id="tab-romp" href="/romp/" style="text-decoration: none; color: inherit;">
        <span class="tab-icon">📺</span>
        <span class="tab-text">Cast ROMP</span>
      </a>
    </nav>

    <!-- Quick Game Selection Bar (Single clean row) -->
    <div class="game-select-bar">
      <button class="game-pill-btn active" data-game="mario">🍄 Super Mario</button>
      <button class="game-pill-btn" data-game="fruit">🍉 Fruit Ninja</button>
      <button class="game-pill-btn" data-game="saber">⚡ Neon Saber</button>
      <button class="game-pill-btn" data-game="kart">🏎️ Kart Racer</button>
      <button class="game-pill-btn" data-game="dodge">🚀 Galaxy</button>
    </div>

    <!-- VIEW 1: GAMEPAD / TOUCH (Simple, ergonomic, arcade feel) -->
    <section class="mode-view active" id="view-handheld">
      <button class="action-btn-green" id="btn-start-tv">
        ▶️ START GAME ON TV
      </button>

      <!-- Clean Ergonomic Arcade D-Pad & Action Buttons -->
      <div class="arcade-gamepad">
        <!-- Directional Pad (Left & Right) -->
        <div class="dpad-group">
          <button id="btn-mario-left" class="pad-btn pad-left">
            <span class="pad-arrow">◀</span>
            <span class="pad-label">RUN LEFT</span>
          </button>
          <button id="btn-mario-right" class="pad-btn pad-right">
            <span class="pad-arrow">▶</span>
            <span class="pad-label">RUN RIGHT</span>
          </button>
        </div>

        <!-- Action Pad (Jump / Fire / Strike) -->
        <div class="action-group">
          <button id="btn-mario-jump" class="action-btn-jump">
            <span class="action-icon">🦘</span>
            <span class="action-label">JUMP</span>
          </button>
          <button id="btn-mario-fire" class="action-btn-fire">
            <span class="action-icon">🔥</span>
            <span class="action-label">FIRE / HIT</span>
          </button>
        </div>
      </div>

      <!-- Physical Phone Swing Button -->
      <button class="big-strike-btn" id="btn-strike">
        🗡️ PHYSICAL SWING / SLASH
        <small>(Or swing your phone firmly like a sword!)</small>
      </button>

      <!-- Bottom Mini-Controls -->
      <div class="mini-controls">
        <button class="aux-btn" id="btn-calibrate">🎯 Re-center</button>
        <button class="aux-btn" id="btn-invert-dir">↔️ Normal</button>
        <button class="aux-btn" id="btn-permission">⚙️ Sensors</button>
      </div>
    </section>

    <!-- VIEW 2: BODY CAMERA (Clean, full view, simple controls) -->
    <section class="mode-view" id="view-body">
      <button class="action-btn-green" id="btn-start-tv-body">
        ▶️ START GAME ON TV
      </button>

      <!-- Camera Viewport with Skeleton Canvas -->
      <div class="camera-wrapper">
        <video id="webcam-feed" playsinline muted autoplay></video>
        <canvas id="pose-canvas"></canvas>

        <div class="camera-overlay-info">
          <span class="pose-badge" id="pose-badge">CAMERA READY</span>
        </div>
      </div>

      <!-- Primary Camera Controls -->
      <div class="camera-action-row">
        <button class="action-btn-green" id="btn-toggle-camera" style="flex: 2;">
          📹 START BODY CAMERA
        </button>
        <button class="aux-btn" id="btn-flip-camera" style="flex: 1;">
          🔄 FLIP
        </button>
        <button class="aux-btn" id="btn-invert-body" style="flex: 1;">
          ↔️ MIRROR
        </button>
      </div>

      <!-- Real-time Body Feedback Pill -->
      <div id="phone-motion-hud" class="motion-feedback-bar">
        <span id="hud-lane-left">◀️ LEFT</span>
        <span id="hud-lane-center" class="active">🧍 CENTER</span>
        <span id="hud-lane-right">RIGHT ▶️</span>
      </div>
      <div id="phone-action-feedback" class="action-feedback-bar">
        <span id="hud-action-jump">🦘 JUMP (UP)</span>
        <span id="hud-action-fire">🔥 PUNCH</span>
      </div>
    </section>

    <!-- Hidden elements kept for script compatibility -->
    <div style="display: none;" aria-hidden="true">
      <div id="phone-3d"></div>
      <span id="intensity-val"></span>
      <div id="intensity-fill"></div>
      <div id="body-energy-bar"></div>
      <span id="body-energy-val"></span>
      <span id="diag-tilt"></span>
      <span id="diag-g"></span>
      <span id="diag-packets"></span>
      <span id="diag-body-x"></span>
      <span id="diag-body-punch"></span>
      <span id="diag-body-engine"></span>
      <div id="https-helper-banner"></div>
      <a id="https-switch-link" href="#"></a>
      <button id="btn-dismiss-banner"></button>
      <div id="mario-touch-pad"></div>
      <div id="mario-body-touch-pad"></div>
      <button id="btn-body-mario-left"></button>
      <button id="btn-body-mario-right"></button>
      <button id="btn-body-mario-jump"></button>
      <button id="btn-body-mario-fire"></button>
      <div id="camera-tap-prompt"></div>
    </div>

    <!-- Romp Launcher Modal: Clean 1-card dialog -->
    <div id="romp-modal" class="romp-clean-modal" style="display: none;">
      <div class="romp-modal-content">
        <div style="font-size: 38px; margin-bottom: 8px;">🕹️</div>
        <h2 style="font-size: 1.3rem; color: #fff; margin-bottom: 6px;">ROMP MOTION ARENA</h2>
        <p style="color: #94a3b8; font-size: 0.85rem; margin-bottom: 20px;">17 Full-Body Games (Run, Pulse, Slice, Goalie &amp; more)</p>
        
        <a id="link-play-romp-phone" href="/romp/" class="modal-primary-btn">
          🚀 OPEN &amp; CAST TO TV
        </a>
        <button id="btn-launch-romp-tv" class="modal-secondary-btn">
          📺 OPEN RECEIVER ON TV
        </button>

        <div class="modal-tip">
          💡 <b>Native Screen Mirror:</b> Pull down phone notification bar &rarr; tap <b>Smart View / Cast</b> &rarr; tap <b>Thomson TV</b>!
        </div>

        <button id="btn-close-romp-modal" class="modal-close-btn">CLOSE</button>
      </div>
    </div>
  </div>

  <script src="phone.js"></script>
</body>
</html>
